// 2. إصلاح وظيفة فتح لوحة التحكم لضمان عملها في المتصفحات الحديثة
function openAdmin() {
    // استخدمنا تأخير بسيط لضمان استجابة المتصفح
    setTimeout(() => {
        let pass = prompt("الرجاء إدخال كلمة مرور لوحة التحكم:");
        if (pass === "9974") {
            // إظهار لوحة التحكم (تأكد أن الـ ID مطابق لما في كودك)
            const adminPanel = document.getElementById('adminPage') || document.querySelector('.admin-page');
            if (adminPanel) {
                // إخفاء الصفحات الأخرى وإظهار الإدارة
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                adminPanel.classList.add('active');
                
                // تفعيل واجهة الإدارة الداخلية
                const adminMain = document.querySelector('.admin-main');
                const adminLogin = document.querySelector('.admin-login-wrap');
                if (adminMain) adminMain.style.display = 'block';
                if (adminLogin) adminLogin.style.display = 'none';
            }
        } else if (pass !== null) {
            alert("كلمة المرور غير صحيحة");
        }
    }, 100);
}

// 3. تأمين روابط الـ API الأخرى (مثل الواتساب)
function sendWhatsAppOrder(phone, message) {
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
}
