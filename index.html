<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجوهرات السرمد - النسخة الاحترافية</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold-light: #E8C97A; --navy: #0D1B2A; --navy-mid: #1A2F45; --cream: #F5EDD6; --white: #FFFFFF;
    --whatsapp: #25D366; --facebook: #1877F2; --insta: #E4405F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Tajawal', sans-serif; background: var(--navy); color: var(--cream); min-height: 100vh; padding-bottom: 80px; }
  
  header { position: sticky; top: 0; z-index: 100; background: rgba(13,27,42,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(201,168,76,0.2); padding: 15px; text-align: center; }
  .brand-name { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--gold-light); }

  .catalog-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; max-width: 900px; margin: 0 auto; }
  
  /* كارت المنتج */
  .product-card { background: var(--navy-mid); border: 1px solid rgba(201,168,76,0.2); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.3s; }
  .product-card:hover { transform: translateY(-5px); border-color: var(--gold); }
  .card-img-wrap { aspect-ratio: 1; position: relative; background: #000; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: 10px; }
  .card-name { font-size: 0.9rem; font-weight: bold; color: var(--white); }
  .card-meta { font-size: 0.75rem; color: var(--gold-light); margin-top: 5px; }

  /* النافذة المنبثقة (Modal) */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
  .modal-content { background: var(--navy-mid); width: 100%; max-width: 500px; border-radius: 20px; overflow: hidden; position: relative; border: 1px solid var(--gold); }
  .modal-close { position: absolute; top: 15px; right: 15px; background: var(--gold); color: var(--navy); border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer; z-index: 1001; }
  
  /* معرض الصور داخل النافذة */
  .slider-container { position: relative; aspect-ratio: 1; background: #000; }
  .slider-img { width: 100%; height: 100%; object-fit: contain; }
  .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(201,168,76,0.7); color: white; border: none; padding: 10px; cursor: pointer; font-size: 1.2rem; border-radius: 5px; }
  .btn-next { left: 10px; } .btn-prev { right: 10px; }

  .modal-body { padding: 20px; }
  .modal-title { font-size: 1.3rem; color: var(--gold-light); margin-bottom: 10px; }
  .modal-desc { font-size: 0.9rem; color: var(--cream); line-height: 1.6; margin-bottom: 15px; border-top: 1px solid rgba(201,168,76,0.2); padding-top: 10px; }
  .modal-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; font-size: 0.85rem; }
  .info-item { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; text-align: center; border: 1px solid rgba(201,168,76,0.1); }

  .modal-actions { display: flex; flex-direction: column; gap: 10px; }
  .modal-btn { padding: 12px; border-radius: 10px; text-decoration: none; color: white; text-align: center; font-weight: bold; font-size: 0.9rem; }
</style>
</head>
<body>

<header><div class="brand-name">مجوهرات السرمد</div></header>

<div class="catalog-grid" id="catalogGrid"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    
    <div class="slider-container">
      <img id="modalImg" class="slider-img" src="">
      <button class="slider-btn btn-prev" onclick="changeImg(-1)">❮</button>
      <button class="slider-btn btn-next" onclick="changeImg(1)">❯</button>
    </div>

    <div class="modal-body">
      <h2 id="modalTitle" class="modal-title"></h2>
      <div class="modal-info-grid">
        <div class="info-item">الوزن: <span id="modalWeight"></span></div>
        <div class="info-item">القياس: <span id="modalSize"></span></div>
      </div>
      <p id="modalDesc" class="modal-desc"></p>
      
      <div class="modal-actions">
        <a href="#" id="waBtn" class="modal-btn" style="background: var(--whatsapp)">اطلب عبر واتساب</a>
        <a href="#" id="fbBtn" class="modal-btn" style="background: var(--facebook)">تواصل عبر فيسبوك</a>
      </div>
    </div>
  </div>
</div>

<script>
const MY_PHONE = "9647713763001";
const FB_LINK = "https://www.facebook.com/share/18kZuu9mkd/";

// --- قائمة المنتجات مع دعم الصور المتعددة والوصف ---
const products = [
  { 
    id: 1, 
    name: "محبس مطروح الشذر", 
    category: "محابس", 
    weight: "2.31غ", 
    size: "17", 
    images: ["https://ibb.co/fdG49c3Y", "رابط_صورة_ثانية", "رابط_صورة_ثالثة"], 
    description: "محبس صياغة درجة أولى مع شذر فيروزي أصلي، يتميز بنقشة يدوية دقيقة وتصميم كلاسيكي فخم يناسب المناسبات." 
  },
  { 
    id: 2, 
    name: "محبس موديل 2", 
    category: "محابس", 
    weight: "3.1غ", 
    size: "18", 
    images: ["https://via.placeholder.com/400"], 
    description: "تصميم عصري بسيط وعملي، ذهب عيار 9 نقي، مريح جداً للارتداء اليومي." 
  }
];

let currentProduct = null;
let currentImgIdx = 0;

function renderGrid() {
  const grid = document.getElementById('catalogGrid');
  grid.innerHTML = products.map(p => `
    <div class="product-card" onclick="openModal(${p.id})">
      <div class="card-img-wrap"><img src="${p.images[0]}"></div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-meta">⚖️ ${p.weight} | 📏 ${p.size || '-'}</div>
      </div>
    </div>
  `).join('');
}

function openModal(id) {
  currentProduct = products.find(p => p.id === id);
  currentImgIdx = 0;
  document.getElementById('modalTitle').innerText = currentProduct.name;
  document.getElementById('modalWeight').innerText = currentProduct.weight;
  document.getElementById('modalSize').innerText = currentProduct.size || 'متوفر';
  document.getElementById('modalDesc').innerText = currentProduct.description || 'لا يوجد وصف حالياً.';
  updateSlider();
  
  const msg = encodeURIComponent(`أهلاً مجوهرات السرمد، أريد الاستفسار عن: ${currentProduct.name} (وزن: ${currentProduct.weight})`);
  document.getElementById('waBtn').href = `https://wa.me/${MY_PHONE}?text=${msg}`;
  document.getElementById('fbBtn').href = FB_LINK;

  document.getElementById('modalOverlay').style.display = 'flex';
}

function updateSlider() {
  document.getElementById('modalImg').src = currentProduct.images[currentImgIdx];
  // إخفاء أزرار السلايدر إذا كانت هناك صورة واحدة فقط
  const btns = document.querySelectorAll('.slider-btn');
  btns.forEach(b => b.style.display = currentProduct.images.length > 1 ? 'block' : 'none');
}

function changeImg(step) {
  currentImgIdx = (currentImgIdx + step + currentProduct.images.length) % currentProduct.images.length;
  updateSlider();
}

function closeModalDirect() { document.getElementById('modalOverlay').style.display = 'none'; }
function closeModal(e) { if(e.target.id === 'modalOverlay') closeModalDirect(); }

renderGrid();
</script>
</body>
</html>
