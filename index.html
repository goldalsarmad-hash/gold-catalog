<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجوهرات السرمد | الفخامة في عيار 9</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37; --gold-dark: #996515; --navy: #050A10; --navy-light: #101825;
            --white: #FFFFFF; --cream: #F4F4F4; --shadow: rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--navy); color: var(--cream); line-height: 1.6; overflow-x: hidden; }

        /* Header */
        header { 
            background: rgba(5, 10, 16, 0.8); backdrop-filter: blur(15px);
            padding: 20px; text-align: center; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); letter-spacing: 2px; }

        /* Grid Layout */
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .product-card { 
            background: var(--navy-light); border-radius: 15px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.4s;
        }
        .product-card:active { transform: scale(0.95); }
        .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-bottom: 2px solid var(--gold-dark); }
        .card-info { padding: 12px; text-align: center; }
        .card-name { font-weight: 700; font-size: 0.9rem; color: var(--white); margin-bottom: 5px; }
        .card-price { color: var(--gold); font-size: 0.8rem; font-weight: 300; }

        /* Modern Modal */
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); 
            display: none; justify-content: center; align-items: flex-start; 
            z-index: 2000; padding: 15px; overflow-y: auto;
        }
        .modal-content { 
            background: var(--navy-light); width: 100%; max-width: 500px; 
            border-radius: 25px; overflow: hidden; margin-top: 20px;
            animation: zoomIn 0.3s ease-out; border: 1px solid var(--gold-dark);
        }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Image Slider */
        .slider { position: relative; width: 100%; aspect-ratio: 1; background: #000; }
        .slider img { width: 100%; height: 100%; object-fit: contain; }
        .nav-btn { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: rgba(212, 175, 55, 0.4); border: none; color: white;
            padding: 10px 15px; cursor: pointer; border-radius: 50%; font-size: 1.2rem;
        }
        .prev { right: 10px; } .next { left: 10px; }

        /* Modal Details */
        .modal-details { padding: 25px; }
        .modal-title { font-size: 1.4rem; color: var(--gold); margin-bottom: 10px; border-bottom: 1px solid var(--gold-dark); padding-bottom: 10px; }
        .modal-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .spec-box { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; text-align: center; }
        .spec-box span { display: block; font-size: 0.7rem; color: var(--gold); }
        .modal-desc { font-size: 0.95rem; line-height: 1.8; color: #ccc; margin-bottom: 25px; }

        /* Action Buttons */
        .action-btns { display: grid; gap: 10px; }
        .btn { 
            padding: 15px; border-radius: 12px; text-decoration: none; 
            text-align: center; font-weight: 700; font-size: 0.9rem; transition: 0.3s;
        }
        .btn-wa { background: #25D366; color: white; }
        .btn-close { background: #333; color: white; margin-top: 10px; cursor: pointer; border: none; font-family: inherit; }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>

<header>
    <div class="logo">مجوهرات السرمد</div>
</header>

<div class="container">
    <div class="product-grid" id="grid"></div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="slider">
            <img id="m-img" src="">
            <button class="nav-btn prev" onclick="moveImg(-1)">❯</button>
            <button class="nav-btn next" onclick="moveImg(1)">❮</button>
        </div>
        <div class="modal-details">
            <h2 id="m-title" class="modal-title"></h2>
            <div class="modal-specs">
                <div class="spec-box"><span id="m-cat-label">الصنف</span><b id="m-cat"></b></div>
                <div class="spec-box"><span>الوزن التقريبي</span><b id="m-weight"></b></div>
            </div>
            <p id="m-desc" class="modal-desc"></p>
            <div class="action-btns">
                <a href="#" id="m-wa" class="btn btn-wa">اطلب عبر واتساب الآن</a>
                <button class="btn btn-close" onclick="closeModalDirect()">إغلاق النافذة</button>
            </div>
        </div>
    </div>
</div>

<script>
    const MY_PHONE = "9647713763001";
    
    // --- قاعدة بيانات المنتجات (اضف صورك ووصفك هنا) ---
    const products = [
        { 
            id: 1, 
            name: "محبس مطروح الشذر", 
            category: "محابس", 
            weight: "2.31غ", 
            images: [
                "https://ibb.co/fdG49c3Y", // الصورة الأساسية
                "https://via.placeholder.com/500?text=Side+View", // صورة ثانية
                "https://via.placeholder.com/500?text=Inside+View" // صورة ثالثة
            ], 
            description: "صياغة إيطالية فاخرة عيار 9، يتوسطه حجر شذر فيروزي طبيعي مختار بعناية. التصميم يجمع بين الأصالة والحداثة، مريح جداً للاستخدام اليومي."
        },
        { 
            id: 2, 
            name: "محبس كارتير كلاسيك", 
            category: "محابس", 
            weight: "3.10غ", 
            images: ["https://via.placeholder.com/500?text=Cartier"], 
            description: "موديل كارتير الشهير بلمسة عيار 9. يتميز بلمعة براقة ومقاومة عالية للتغير. قطعة لا تذبل بمرور الزمن."
        }
        // أضف الـ 50 قطعة هنا بنفس النمط...
    ];

    let currentProd = null;
    let imgIdx = 0;

    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = products.map(p => `
            <div class="product-card" onclick="openModal(${p.id})">
                <img src="${p.images[0]}" class="card-img" alt="${p.name}">
                <div class="card-info">
                    <div class="card-name">${p.name}</div>
                    <div class="card-price">الوزن: ${p.weight}</div>
                </div>
            </div>
        `).join('');
    }

    function openModal(id) {
        currentProd = products.find(p => p.id === id);
        imgIdx = 0;
        document.getElementById('m-title').innerText = currentProd.name;
        document.getElementById('m-weight').innerText = currentProd.weight;
        document.getElementById('m-cat').innerText = currentProd.category;
        document.getElementById('m-desc').innerText = currentProd.description;
        
        updateImg();
        
        const text = `أهلاً مجوهرات السرمد، أريد الاستفسار عن: ${currentProd.name} (وزن: ${currentProd.weight})`;
        document.getElementById('m-wa').href = `https://wa.me/${MY_PHONE}?text=${encodeURIComponent(text)}`;
        
        document.getElementById('modal').style.display = 'flex';
        document.body.style.overflow = 'hidden'; // منع سكرول الخلفية
    }

    function updateImg() {
        document.getElementById('m-img').src = currentProd.images[imgIdx];
        const btns = document.querySelectorAll('.nav-btn');
        btns.forEach(b => b.style.display = currentProd.images.length > 1 ? 'block' : 'none');
    }

    function moveImg(step) {
        imgIdx = (imgIdx + step + currentProd.images.length) % currentProd.images.length;
        updateImg();
    }

    function closeModalDirect() {
        document.getElementById('modal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function closeModal(e) {
        if(e.target.id === 'modal') closeModalDirect();
    }

    render();
</script>
</body>
</html>
